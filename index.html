<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPS CACD — Grade de Respostas</title>
<style>
  :root {
    --bg: #1a1b26;
    --bg-deep: #100f0f;
    --bg-panel: #1c1b1a;
    --bg-hover: #282726;
    --bg-active: #343331;
    --border: #3a3835;
    --border-muted: #252321;
    --text: #cecdc3;
    --text-dim: #878580;
    --text-faint: #575350;
    --accent: #83a598;
    --accent-dim: rgba(131,165,152,0.15);
    --success: #8ec07c;
    --success-dim: rgba(142,192,124,0.12);
    --error: #fb4934;
    --error-dim: rgba(251,73,52,0.12);
    --warning: #fabd2f;
    --radius: 5px;
    --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    --t: 150ms ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; font-family: var(--font-sans); font-size: 14px;
    color: var(--text); background: var(--bg);
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  /* === Landing === */
  .landing {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
  }
  .landing-title { font-size: 22px; font-weight: 700; color: var(--accent); }
  .landing-sub { font-size: 13px; color: var(--text-dim); }
  .landing select {
    padding: 10px 20px; font-size: 16px; font-family: var(--font-mono);
    background: var(--bg-panel); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; outline: none;
    appearance: none; text-align: center; min-width: 200px;
  }
  .landing select:focus { border-color: var(--accent); }
  .landing select option { background: var(--bg-panel); }

  /* === Toolbar === */
  .toolbar {
    display: flex; align-items: center; height: 48px;
    padding: 0 16px; background: var(--bg-deep);
    border-bottom: 1px solid var(--border); gap: 12px;
    flex-shrink: 0;
  }
  .toolbar-title { font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .toolbar-stats { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
  .toolbar-spacer { flex: 1; }
  .btn {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-panel); color: var(--text); font-family: var(--font-sans);
    font-size: 13px; cursor: pointer; transition: all var(--t); white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
  .btn-primary { background: var(--accent); color: var(--bg-deep); border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { color: #fff; }
  .btn-csv { background: #d09040; color: var(--bg-deep); border-color: #d09040; font-weight: 600; }
  .btn-csv:hover { color: #fff; border-color: #d09040; }

  /* === Grid wrap === */
  .grid-wrap { flex: 1; overflow-y: auto; padding: 16px; }
  .grid-wrap::-webkit-scrollbar { width: 6px; }
  .grid-wrap::-webkit-scrollbar-track { background: var(--bg); }
  .grid-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* === 2024 mode: question cards === */
  .grid-2024 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px; max-width: 1400px; margin: 0 auto;
  }
  .question {
    background: var(--bg-panel); border: 1px solid var(--border-muted);
    border-radius: var(--radius); padding: 8px 10px; transition: border-color var(--t);
  }
  .question.done { border-color: var(--accent); border-left: 3px solid var(--accent); }
  .q-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .q-label { font-weight: 700; font-size: 13px; color: var(--accent); font-family: var(--font-mono); }
  .q-check { font-size: 14px; color: var(--success); opacity: 0; transition: opacity var(--t); }
  .question.done .q-check { opacity: 1; }
  .items { display: flex; gap: 4px; }
  .item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 2px; padding: 6px 2px; border-radius: var(--radius);
    cursor: pointer; transition: all var(--t); border: 1px solid transparent;
    user-select: none;
  }
  .item:hover { background: var(--bg-hover); }
  .item.focused { outline: 2px solid var(--accent); outline-offset: -1px; }
  .item-num { font-size: 11px; font-weight: 600; color: var(--text-dim); font-family: var(--font-mono); }
  .item-circle {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--t); font-size: 11px;
  }
  .item.certo { background: var(--success-dim); border-color: rgba(142,192,124,0.25); }
  .item.certo .item-circle { background: var(--success); border-color: var(--success); color: var(--bg-deep); font-weight: 700; }
  .item.certo .item-num { color: var(--success); }
  .item.errado { background: var(--error-dim); border-color: rgba(251,73,52,0.15); }
  .item.errado .item-circle { background: var(--error); border-color: var(--error); color: var(--bg-deep); font-weight: 700; }
  .item.errado .item-num { color: var(--error); }

  /* === 2025/2026 mode: flat cells === */
  .grid-flat {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 4px; max-width: 1400px; margin: 0 auto;
  }
  .cell {
    background: var(--bg-panel); border: 1px solid var(--border-muted);
    border-radius: var(--radius); padding: 4px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: pointer; transition: all var(--t); user-select: none;
  }
  .cell:hover { background: var(--bg-hover); }
  .cell.focused { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cell-num { font-size: 10px; font-weight: 600; color: var(--text-faint); font-family: var(--font-mono); }
  .cell-circle {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--t); font-size: 11px;
  }
  .cell.certo { background: var(--success-dim); border-color: rgba(142,192,124,0.25); }
  .cell.certo .cell-circle { background: var(--success); border-color: var(--success); color: var(--bg-deep); font-weight: 700; }
  .cell.certo .cell-num { color: var(--success); }
  .cell.errado { background: var(--error-dim); border-color: rgba(251,73,52,0.15); }
  .cell.errado .cell-circle { background: var(--error); border-color: var(--error); color: var(--bg-deep); font-weight: 700; }
  .cell.errado .cell-num { color: var(--error); }

  /* === Bottom bar === */
  .bottom-bar {
    display: flex; align-items: center; height: 36px;
    padding: 0 16px; background: var(--bg-deep);
    border-top: 1px solid var(--border); gap: 20px;
    flex-shrink: 0; font-size: 12px; color: var(--text-dim);
    font-family: var(--font-mono);
  }
  .bottom-bar .done-count { color: var(--success); }
  .bottom-bar .pending-count { color: var(--warning); }

  .hidden { display: none !important; }

  /* === Mobile === */
  @media (max-width: 600px) {
    .toolbar { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
    .toolbar-spacer { display: none; }
    .toolbar-title { width: 100%; text-align: center; }
    .toolbar-stats { order: 10; width: 100%; text-align: center; }
    .grid-2024 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .grid-flat { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
    .cell { padding: 6px 0; }
    .cell-circle { width: 32px; height: 32px; font-size: 13px; }
    .cell-num { font-size: 11px; }
    .item-circle { width: 34px; height: 34px; font-size: 13px; }
    .bottom-bar { flex-wrap: wrap; height: auto; padding: 6px 12px; gap: 6px; justify-content: center; }
  }
</style>
</head>
<body>

<!-- Landing -->
<div class="landing" id="landing">
  <div class="landing-title">TPS CACD — Grade de Respostas</div>
  <div class="landing-sub">Escolha o ano para comecar</div>
  <select id="yearSelect">
    <option value="" disabled selected>Ano...</option>
    <option value="2014">2014 — 73 questoes x 4 itens</option>
    <option value="2015">2015 — 73 questoes x 4 itens</option>
    <option value="2016">2016 — 73 questoes x 4 itens</option>
    <option value="2017">2017 — 73 questoes x 4 itens</option>
    <option value="2018">2018 — 73 questoes x 4 itens</option>
    <option value="2019">2019 — 73 questoes x 4 itens</option>
    <option value="2020">2020 — 73 questoes x 4 itens</option>
    <option value="2021">2021 — 73 questoes x 4 itens</option>
    <option value="2022">2022 — 73 questoes x 4 itens</option>
    <option value="2023">2023 — 73 questoes x 4 itens</option>
    <option value="2024">2024 — 65 questoes x 4 itens</option>
    <option value="2025">2025 — 240 itens</option>
    <option value="2026">2026 — 240 itens</option>
  </select>
</div>

<!-- App (hidden until year selected) -->
<div class="toolbar hidden" id="toolbar">
  <span class="toolbar-title" id="toolbarTitle"></span>
  <span class="toolbar-stats" id="statsTop"></span>
  <div class="toolbar-spacer"></div>
  <button class="btn" onclick="backToLanding()">Voltar</button>
  <button class="btn" onclick="clearAll()">Limpar tudo</button>
  <button class="btn btn-primary" onclick="exportJSON()">Exportar JSON</button>
  <button class="btn btn-csv" onclick="exportCSV()">Exportar CSV</button>
</div>

<div class="grid-wrap hidden" id="gridWrap">
  <div id="grid"></div>
</div>

<div class="bottom-bar hidden" id="bottomBar">
  <span>Completas: <span class="done-count" id="doneCount">0</span>/<span id="totalCount">0</span></span>
  <span>Pendentes: <span class="pending-count" id="pendingCount">0</span></span>
  <span id="hintBar"></span>
</div>

<script>
// ── Config per year ──
const CONFIGS = {
  2014: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2014 — Texto' },
  2015: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2015 — Texto' },
  2016: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2016 — Texto' },
  2017: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2017 — Texto' },
  2018: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2018 — Texto' },
  2019: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2019 — Texto' },
  2020: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2020 — Texto' },
  2021: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2021 — Texto' },
  2022: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2022 — Texto' },
  2023: { mode: 'grouped', questions: 73, itemsPer: 4, total: 292, label: 'CACD 2023 — Texto' },
  2024: { mode: 'grouped', questions: 65, itemsPer: 4, total: 260, label: 'CACD 2024 — Texto' },
  2025: { mode: 'flat', total: 240, label: 'CACD 2025 — TPS' },
  2026: { mode: 'flat', total: 240, label: 'CACD 2026 — TPS' },
};

let currentYear = null;
let config = null;
let respostas = {};  // grouped: {q: {i: val}} | flat: {i: val}
let focusQ = 1;      // grouped: question index | flat: unused
let focusI = 1;      // grouped: item index    | flat: item index

// ── Init ──
document.getElementById('yearSelect').addEventListener('change', (e) => {
  startYear(parseInt(e.target.value));
});

function startYear(year) {
  currentYear = year;
  config = CONFIGS[year];
  respostas = {};
  if (config.mode === 'grouped') {
    for (let q = 1; q <= config.questions; q++) {
      respostas[q] = {};
      for (let i = 1; i <= config.itemsPer; i++) respostas[q][i] = null;
    }
    focusQ = 1; focusI = 1;
  } else {
    for (let i = 1; i <= config.total; i++) respostas[i] = null;
    focusI = 1;
  }
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('toolbar').classList.remove('hidden');
  document.getElementById('gridWrap').classList.remove('hidden');
  document.getElementById('bottomBar').classList.remove('hidden');
  document.getElementById('toolbarTitle').textContent = config.label;
  document.getElementById('hintBar').textContent =
    config.mode === 'grouped'
      ? 'C=certo \u00b7 E=errado \u00b7 setas=mover \u00b7 Ctrl+seta=questao'
      : 'C=certo \u00b7 E=errado \u00b7 setas=mover no grid';
  render();
  if (config.mode === 'grouped') setFocusGrouped(1, 1);
  else setFocusFlat(1);
}

function backToLanding() {
  const total = config.mode === 'grouped' ? config.total : config.total;
  const filled = countDone();
  if (filled > 0 && !confirm('Tem ' + filled + ' marcacoes. Sair mesmo?')) return;
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('toolbar').classList.add('hidden');
  document.getElementById('gridWrap').classList.add('hidden');
  document.getElementById('bottomBar').classList.add('hidden');
  document.getElementById('yearSelect').value = '';
  currentYear = null;
}

// ── Counting ──
function countDone() {
  if (config.mode === 'grouped') {
    let n = 0;
    for (let q = 1; q <= config.questions; q++) {
      let allDone = true;
      for (let i = 1; i <= config.itemsPer; i++) { if (respostas[q][i] === null) allDone = false; }
      if (allDone) n++;
    }
    return n;
  } else {
    let n = 0;
    for (let i = 1; i <= config.total; i++) { if (respostas[i] !== null) n++; }
    return n;
  }
}

function totalSlots() {
  return config.mode === 'grouped' ? config.questions : config.total;
}

function updateCounts() {
  const done = countDone();
  const tot = totalSlots();
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = tot;
  document.getElementById('pendingCount').textContent = tot - done;
  document.getElementById('statsTop').textContent = done + '/' + tot + ' completas';
}

// ── Render ──
function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (config.mode === 'grouped') {
    grid.className = 'grid-2024';
    renderGrouped(grid);
  } else {
    grid.className = 'grid-flat';
    renderFlat(grid);
  }
  updateCounts();
}

function renderGrouped(grid) {
  for (let q = 1; q <= config.questions; q++) {
    const r = respostas[q];
    const done = r[1] !== null && r[2] !== null && r[3] !== null && r[4] !== null;
    const div = document.createElement('div');
    div.className = 'question' + (done ? ' done' : '');
    div.id = 'q' + q;
    let html = '<div class="q-header"><span class="q-label">Q' + q + '</span><span class="q-check">\u2713</span></div><div class="items">';
    for (let i = 1; i <= 4; i++) {
      const v = r[i];
      const cls = v === 'C' ? 'certo' : v === 'E' ? 'errado' : '';
      const sym = v === 'C' ? '\u2713' : v === 'E' ? '\u2717' : '';
      html += '<div class="item ' + cls + '" data-q="' + q + '" data-i="' + i + '" onclick="clickGrouped(' + q + ',' + i + ')"><span class="item-num">' + i + '</span><div class="item-circle">' + sym + '</div></div>';
    }
    html += '</div>';
    div.innerHTML = html;
    grid.appendChild(div);
  }
}

function renderFlat(grid) {
  for (let i = 1; i <= config.total; i++) {
    const v = respostas[i];
    const cls = v === 'C' ? 'certo' : v === 'E' ? 'errado' : '';
    const sym = v === 'C' ? '\u2713' : v === 'E' ? '\u2717' : '';
    const div = document.createElement('div');
    div.className = 'cell ' + cls;
    div.id = 'c' + i;
    div.setAttribute('data-i', i);
    div.onclick = () => clickFlat(i);
    div.innerHTML = '<span class="cell-num">' + i + '</span><div class="cell-circle">' + sym + '</div>';
    grid.appendChild(div);
  }
}

// ── Click handlers ──
function clickGrouped(q, i) {
  const cur = respostas[q][i];
  if (cur === null) respostas[q][i] = 'C';
  else if (cur === 'C') respostas[q][i] = 'E';
  else respostas[q][i] = null;
  refreshQuestion(q);
  updateCounts();
  setFocusGrouped(q, i);
}

function clickFlat(i) {
  const cur = respostas[i];
  if (cur === null) respostas[i] = 'C';
  else if (cur === 'C') respostas[i] = 'E';
  else respostas[i] = null;
  refreshCell(i);
  updateCounts();
  setFocusFlat(i);
}

function refreshQuestion(q) {
  const div = document.getElementById('q' + q);
  if (!div) return;
  const r = respostas[q];
  const done = r[1] !== null && r[2] !== null && r[3] !== null && r[4] !== null;
  div.className = 'question' + (done ? ' done' : '');
  div.querySelector('.q-check').style.opacity = done ? '1' : '0';
  const items = div.querySelectorAll('.item');
  for (let idx = 0; idx < 4; idx++) {
    const ii = idx + 1;
    const v = r[ii];
    const isFoc = q === focusQ && ii === focusI;
    items[idx].className = 'item ' + (v === 'C' ? 'certo' : v === 'E' ? 'errado' : '') + (isFoc ? ' focused' : '');
    items[idx].querySelector('.item-circle').textContent = v === 'C' ? '\u2713' : v === 'E' ? '\u2717' : '';
  }
}

function refreshCell(i) {
  const div = document.getElementById('c' + i);
  if (!div) return;
  const v = respostas[i];
  const isFoc = i === focusI;
  div.className = 'cell ' + (v === 'C' ? 'certo' : v === 'E' ? 'errado' : '') + (isFoc ? ' focused' : '');
  div.querySelector('.cell-circle').textContent = v === 'C' ? '\u2713' : v === 'E' ? '\u2717' : '';
}

// ── Focus: grouped ──
function setFocusGrouped(q, i) {
  document.querySelectorAll('.item.focused').forEach(el => el.classList.remove('focused'));
  focusQ = Math.max(1, Math.min(config.questions, q));
  focusI = Math.max(1, Math.min(config.itemsPer, i));
  const qDiv = document.getElementById('q' + focusQ);
  if (qDiv) {
    const items = qDiv.querySelectorAll('.item');
    if (items[focusI - 1]) {
      items[focusI - 1].classList.add('focused');
      items[focusI - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

// ── Focus: flat ──
function setFocusFlat(i) {
  document.querySelectorAll('.cell.focused').forEach(el => el.classList.remove('focused'));
  focusI = Math.max(1, Math.min(config.total, i));
  const cell = document.getElementById('c' + focusI);
  if (cell) {
    cell.classList.add('focused');
    cell.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function getGridCols() {
  const grid = document.getElementById('grid');
  return getComputedStyle(grid).gridTemplateColumns.split(' ').length;
}

// ── Advance ──
function advanceGrouped() {
  if (focusI < config.itemsPer) setFocusGrouped(focusQ, focusI + 1);
  else if (focusQ < config.questions) setFocusGrouped(focusQ + 1, 1);
}

function advanceFlat() {
  if (focusI < config.total) setFocusFlat(focusI + 1);
}

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (!currentYear) return;
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  const cols = getGridCols();

  // C / E keys
  if (e.key === 'c' || e.key === 'C') {
    e.preventDefault();
    if (config.mode === 'grouped') {
      const cur = respostas[focusQ][focusI];
      respostas[focusQ][focusI] = cur === 'C' ? null : 'C';
      refreshQuestion(focusQ); updateCounts();
      if (cur !== 'C') advanceGrouped();
    } else {
      const cur = respostas[focusI];
      respostas[focusI] = cur === 'C' ? null : 'C';
      refreshCell(focusI); updateCounts();
      if (cur !== 'C') advanceFlat();
    }
    return;
  }
  if (e.key === 'e' || e.key === 'E') {
    e.preventDefault();
    if (config.mode === 'grouped') {
      const cur = respostas[focusQ][focusI];
      respostas[focusQ][focusI] = cur === 'E' ? null : 'E';
      refreshQuestion(focusQ); updateCounts();
      if (cur !== 'E') advanceGrouped();
    } else {
      const cur = respostas[focusI];
      respostas[focusI] = cur === 'E' ? null : 'E';
      refreshCell(focusI); updateCounts();
      if (cur !== 'E') advanceFlat();
    }
    return;
  }

  // Arrows
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  e.preventDefault();

  if (config.mode === 'grouped') {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'ArrowRight') setFocusGrouped(focusQ + 1, focusI);
      else if (e.key === 'ArrowLeft') setFocusGrouped(focusQ - 1, focusI);
      else if (e.key === 'ArrowDown') setFocusGrouped(focusQ + cols, focusI);
      else if (e.key === 'ArrowUp') setFocusGrouped(focusQ - cols, focusI);
    } else {
      if (e.key === 'ArrowRight') {
        if (focusI < 4) setFocusGrouped(focusQ, focusI + 1);
        else if (focusQ < config.questions) setFocusGrouped(focusQ + 1, 1);
      } else if (e.key === 'ArrowLeft') {
        if (focusI > 1) setFocusGrouped(focusQ, focusI - 1);
        else if (focusQ > 1) setFocusGrouped(focusQ - 1, 4);
      } else if (e.key === 'ArrowDown') {
        setFocusGrouped(focusQ + cols, focusI);
      } else if (e.key === 'ArrowUp') {
        setFocusGrouped(focusQ - cols, focusI);
      }
    }
  } else {
    if (e.key === 'ArrowRight') setFocusFlat(focusI + 1);
    else if (e.key === 'ArrowLeft') setFocusFlat(focusI - 1);
    else if (e.key === 'ArrowDown') setFocusFlat(focusI + cols);
    else if (e.key === 'ArrowUp') setFocusFlat(focusI - cols);
  }
});

// ── Clear / Export ──
function clearAll() {
  if (!confirm('Limpar todas as marcacoes?')) return;
  if (config.mode === 'grouped') {
    for (let q = 1; q <= config.questions; q++)
      for (let i = 1; i <= config.itemsPer; i++) respostas[q][i] = null;
  } else {
    for (let i = 1; i <= config.total; i++) respostas[i] = null;
  }
  render();
  if (config.mode === 'grouped') setFocusGrouped(1, 1);
  else setFocusFlat(1);
}

function exportJSON() {
  const out = {
    prova: "TPS — Texto",
    concurso: "CACD " + currentYear,
    modo: config.mode,
  };
  if (config.mode === 'grouped') {
    out.total_questoes = config.questions;
    out.itens_por_questao = config.itemsPer;
    out.respostas = {};
    for (let q = 1; q <= config.questions; q++) {
      out.respostas[q] = {};
      for (let i = 1; i <= config.itemsPer; i++)
        out.respostas[q][i] = respostas[q][i] || "pendente";
    }
  } else {
    out.total_itens = config.total;
    out.respostas = {};
    for (let i = 1; i <= config.total; i++)
      out.respostas[i] = respostas[i] || "pendente";
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respostas-tps-cacd-' + currentYear + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportCSV() {
  let csv = '';
  if (config.mode === 'grouped') {
    csv = 'questao,item,resposta\n';
    for (let q = 1; q <= config.questions; q++)
      for (let i = 1; i <= config.itemsPer; i++)
        csv += q + ',' + i + ',' + (respostas[q][i] || '') + '\n';
  } else {
    csv = 'item,resposta\n';
    for (let i = 1; i <= config.total; i++)
      csv += i + ',' + (respostas[i] || '') + '\n';
  }
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respostas-tps-cacd-' + currentYear + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
